<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Revo UI README preview</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        width: 1800px;
        height: 1320px;
        overflow: hidden;
      }
      .preview-half {
        position: absolute;
        inset: 0;
        width: 1800px;
        height: 1320px;
        font-family: Inter, Arial, sans-serif;
        color: var(--rv-ui-text);
        background: var(--rv-ui-surface);
      }
      .preview-half.light {
        background: #f7f9fd;
        clip-path: inset(0 50% 0 0);
      }
      .preview-half.dark {
        background: #141517;
        clip-path: inset(0 0 0 50%);
      }
      .preview-header {
        height: 132px;
        padding: 32px 62px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .preview-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.7px;
      }
      .preview-brand img {
        width: 34px;
        height: 40px;
      }
      .preview-subtitle {
        font-size: 16px;
        color: var(--rv-ui-text-muted);
        margin-top: 9px;
        letter-spacing: 0;
        font-weight: 400;
      }
      .preview-theme {
        border: 1px solid var(--rv-ui-border);
        padding: 9px 15px;
        border-radius: 24px;
        color: var(--rv-ui-text-muted);
        font-size: 13px;
        letter-spacing: 1.8px;
        font-weight: 600;
      }
      .preview-grid {
        position: absolute;
        top: 142px;
        left: 62px;
        right: 62px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 26px;
      }
      .preview-stack {
        display: flex;
        flex-direction: column;
        gap: 26px;
        min-width: 0;
      }
      .preview-grid .home-widget {
        border-color: color-mix(in srgb, var(--rv-ui-text) 13%, transparent);
        padding: 27px;
        gap: 18px;
        border-radius: 20px;
        box-shadow: 0 6px 24px #00000004;
      }
      .preview-grid .home-weekly-planner {
        width: auto;
        min-width: 0;
        margin: 0;
        --rv-matrix-cell-height: 22px;
      }
      .preview-grid .planning-summary {
        display: none;
      }
      .preview-grid p,
      .preview-grid h3 {
        margin: 0;
      }
      .preview-grid .finance-amount {
        font-size: 34px;
      }
      .preview-grid .home-widget h3 {
        font-size: 20px;
      }
      .preview-grid .finance-revenue,
      .preview-grid .finance-spending {
        min-height: 414px;
        box-sizing: border-box;
      }
      .preview-grid .finance-spending {
        min-height: 410px;
      }
      .preview-grid .finance-savings {
        min-height: 405px;
        box-sizing: border-box;
      }
      .preview-grid .finance-allocation {
        min-height: 415px;
        box-sizing: border-box;
      }
      .preview-footer {
        position: absolute;
        bottom: 37px;
        left: 62px;
        right: 62px;
        border-top: 1px solid var(--rv-ui-border);
        padding-top: 27px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 26px;
      }
      .preview-feature {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
        font-weight: 600;
      }
      .preview-feature svg {
        width: 26px;
        height: 26px;
        color: var(--rv-ui-accent, #2563eb);
        flex-shrink: 0;
      }
      .preview-feature small {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--rv-ui-text-muted);
        margin-top: 5px;
      }
      .preview-divider {
        position: absolute;
        z-index: 5;
        left: 899px;
        top: 0;
        width: 2px;
        height: 1320px;
        background: linear-gradient(#8f9ab244, #91aaffaa 45%, #8f9ab244);
      }
      #source {
        position: absolute;
        left: -10000px;
        width: 1800px;
        height: 1500px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="source" title="Gallery components" src="/"></iframe>
    <div class="preview-divider"></div>
    <script type="module">
      const frame = document.getElementById("source");
      frame.inert = true;
      await new Promise((resolve) =>
        frame.addEventListener("load", resolve, { once: true }),
      );
      const source = frame.contentDocument;
      while (!source.querySelector(".finance-savings"))
        await new Promise((resolve) => setTimeout(resolve, 20));
      const captureStyle = document.head.querySelector("style");
      for (const style of source.querySelectorAll(
        'style, link[rel="stylesheet"]',
      ))
        document.head.append(style.cloneNode(true));
      document.head.append(captureStyle);
      const check =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="m7.5 12 3 3 6-6"/></svg>';
      const footer = `<footer class="preview-footer">
      <div class="preview-feature">${check}<span>WCAG 2.2 AA checks<small>Automated accessibility regression checks</small></span></div>
      <div class="preview-feature">${check}<span>Keyboard navigation<small>Focus, selection and Escape dismissal</small></span></div>
      <div class="preview-feature">${check}<span>Visible focus<small>Shared focus indicators in both themes</small></span></div>
    </footer>`;
      const columns = [
        [".finance-revenue", ".finance-spending"],
        [".home-weekly-planner", ".finance-recent"],
        [".finance-allocation", ".finance-savings"],
      ];
      for (const theme of ["light", "dark"]) {
        const panel = document.createElement("section");
        panel.className = `rv-ui preview-half ${theme}`;
        panel.dataset.theme = theme;
        panel.innerHTML = `<header class="preview-header"><div><div class="preview-brand"><img src="/favicon.svg" alt="">Revo UI</div><div class="preview-subtitle">Accessible components. One shared system.</div></div><span class="preview-theme">DARK THEME</span></header><div class="preview-grid"></div>${footer}`;
        const grid = panel.querySelector(".preview-grid");
        for (const selectors of columns) {
          const stack = document.createElement("div");
          stack.className = "preview-stack";
          for (const selector of selectors) {
            const original = source.querySelector(selector);
            if (!original)
              throw new Error(`Missing gallery specimen: ${selector}`);
            stack.append(original.cloneNode(true));
          }
          grid.append(stack);
        }
        document.body.append(panel);
      }
      // Keep a visible theme label on each side of the center split.
      const light = document.querySelector(
        ".preview-half.light .preview-header",
      );
      light.insertAdjacentHTML(
        "beforeend",
        '<span class="preview-theme" style="position:absolute;left:710px">LIGHT THEME</span>',
      );
      // Demonstrate the library's real keyboard focus treatment on the dark half.
      document
        .querySelector(".preview-half.dark .finance-contribution button")
        ?.focus({ preventScroll: true });
      await document.fonts.ready;
      await Promise.all(
        [...document.images].map((image) => image.decode().catch(() => {})),
      );
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
