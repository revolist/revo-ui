<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Anatomy of a component preset</title><desc id="desc">A theme contains components, a named preset, a CSS class, built-in props, optional generic defaults, and styles for the root and its parts.</desc>
<rect width="1200" height="460" rx="22" fill="#f6f8ff"/><text x="48" y="58" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19233a">What goes inside a preset?</text>
<rect x="48" y="90" width="535" height="320" rx="16" fill="#20273a"/><g font-family="ui-monospace,SFMono-Regular,monospace" font-size="20" fill="#e3e9ff"><text x="78" y="132">components</text><text x="102" y="170">└─ Switch</text><text x="126" y="208">└─ compact</text><text x="150" y="246">├─ className</text><text x="150" y="284">├─ props / tokens</text><text x="150" y="322">├─ defaults</text><text x="150" y="360">└─ styles</text></g>
<g font-family="system-ui,sans-serif" font-size="17" fill="#34435d"><rect x="625" y="91" width="525" height="70" rx="12" fill="#fff" stroke="#d9dff0"/><text x="646" y="120" font-weight="700" fill="#5127aa">className</text><text x="646" y="145">Connects a preset to your CSS.</text><rect x="625" y="172" width="525" height="70" rx="12" fill="#fff" stroke="#d9dff0"/><text x="646" y="201" font-weight="700" fill="#5127aa">props and tokens</text><text x="646" y="226">Built-in defaults read by the component.</text><rect x="625" y="253" width="525" height="70" rx="12" fill="#fff" stroke="#d9dff0"/><text x="646" y="282" font-weight="700" fill="#5127aa">defaults</text><text x="646" y="307">Other JSON props, applied with presetProps.</text><rect x="625" y="334" width="525" height="70" rx="12" fill="#fff" stroke="#d9dff0"/><text x="646" y="363" font-weight="700" fill="#5127aa">styles</text><text x="646" y="388">Root and part declarations, compiled to CSS.</text></g></svg>
