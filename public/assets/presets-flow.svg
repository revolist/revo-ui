<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">One theme, many projects</title><desc id="desc">JSON defines named presets; themeToCss produces a CSS file. Each project imports the theme and CSS and applies a preset to a component.</desc>
<rect width="1200" height="410" rx="22" fill="#f6f8ff"/><text x="48" y="60" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19233a">One theme. Multiple projects.</text>
<g font-family="system-ui,sans-serif"><rect x="48" y="105" width="310" height="195" rx="16" fill="#fff" stroke="#d9dff0" stroke-width="2"/><text x="72" y="150" font-size="22" font-weight="700" fill="#5127aa">1  theme.json</text><text x="72" y="187" font-size="17" fill="#34435d">Names, options, styles</text><text x="72" y="216" font-size="17" fill="#34435d">and behavior defaults</text><text x="72" y="270" font-size="15" fill="#66728a">Editable and shareable</text>
<path d="M 370 202 H 417" stroke="#8060ca" stroke-width="3"/><path d="M 407 194 L 417 202 L 407 210" fill="none" stroke="#8060ca" stroke-width="3"/>
<rect x="430" y="105" width="310" height="195" rx="16" fill="#fff" stroke="#d9dff0" stroke-width="2"/><text x="454" y="150" font-size="22" font-weight="700" fill="#5127aa">2  themeToCss</text><text x="454" y="187" font-size="17" fill="#34435d">Generates theme.css</text><text x="454" y="216" font-size="17" fill="#34435d">from structured styles</text><text x="454" y="270" font-size="15" fill="#66728a">Add your own CSS too</text>
<path d="M 752 202 H 799" stroke="#8060ca" stroke-width="3"/><path d="M 789 194 L 799 202 L 789 210" fill="none" stroke="#8060ca" stroke-width="3"/>
<rect x="812" y="105" width="340" height="195" rx="16" fill="#fff" stroke="#d9dff0" stroke-width="2"/><text x="836" y="150" font-size="22" font-weight="700" fill="#5127aa">3  Your projects</text><text x="836" y="187" font-size="17" fill="#34435d">Import JSON + CSS</text><text x="836" y="216" font-size="17" fill="#34435d">Apply the named preset</text><text x="836" y="270" font-size="15" fill="#66728a">React · Vue · other adapters</text></g><text x="48" y="360" font-family="system-ui,sans-serif" font-size="16" fill="#526079">The component package supplies the implementation; your files carry the customization.</text></svg>
