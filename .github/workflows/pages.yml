name: Build and deploy Revo UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revo-ui-pages
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.59 does not support Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out gallery
        uses: actions/checkout@v5
        with:
          path: gallery
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Verify component documentation references
        run: node gallery/scripts/check-docs.mjs
      - name: Install locked dependencies
        working-directory: gallery
        run: pnpm install --frozen-lockfile
      - name: Verify UI library and public package
        working-directory: gallery
        run: |
          pnpm --filter @revolist/ui lint
          pnpm --filter @revolist/ui test
          pnpm --filter @revolist/ui pack:public
          pnpm --filter @revolist/ui test:public
      - name: Verify generated API contracts
        working-directory: gallery
        run: pnpm --filter @revolist/ui test:api
      - name: Install browser for static rendering
        working-directory: gallery
        run: pnpm --filter @revolist/ui exec playwright install --with-deps chromium
      - name: Build Pages site
        working-directory: gallery
        run: pnpm --filter @revolist/ui build:demo --base /
      - name: Verify static SEO output
        run: node gallery/scripts/seo.test.mjs gallery/dist-gallery
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: gallery/dist-gallery

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
